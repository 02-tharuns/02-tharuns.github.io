<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Tharun Subramanya — Applied ML / Robotics</title>
    <meta name="description" content="Portfolio, RAG chatbot, and live observability/evals dashboards for Tharun Subramanya's applied ML and robotics work." />

    <!-- Open Graph / LinkedIn, Facebook, Slack, etc. — link-preview crawlers
         don't execute JS, so these tags have to live in this static HTML
         shell rather than being set from React. -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://02-tharuns-github-io.vercel.app/" />
    <meta property="og:title" content="Tharun Subramanya — Applied ML / Robotics" />
    <meta property="og:description" content="Portfolio with a live RAG chatbot (hybrid BM25 + dense + rerank, every answer cited) and public observability/evals dashboards." />
    <meta property="og:image" content="https://02-tharuns-github-io.vercel.app/og-preview.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <!-- Twitter Card — same fields, separate namespace some crawlers check -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Tharun Subramanya — Applied ML / Robotics" />
    <meta name="twitter:description" content="Portfolio with a live RAG chatbot (hybrid BM25 + dense + rerank, every answer cited) and public observability/evals dashboards." />
    <meta name="twitter:image" content="https://02-tharuns-github-io.vercel.app/og-preview.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
