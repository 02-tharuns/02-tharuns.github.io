# Rebuild the index, gate on the eval suite, then publish to GitHub Pages.
# The deploy step only runs if the guardrail metrics hold — a regression in
# retrieval or in the refusal behaviour stops the release.

name: Build, evaluate, deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Rebuild the index from content/
        run: python3 scripts/build_corpus.py

      - name: Fail if the committed index is stale
        run: |
          if ! git diff --quiet -- assets/corpus.js; then
            echo "::error::assets/corpus.js is out of date."
            echo "Run 'python3 scripts/build_corpus.py' and commit the result."
            git diff --stat -- assets/corpus.js
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install the eval harness
        run: |
          npm install playwright@latest
          npx playwright install --with-deps chromium

      - name: Run the guardrail evaluation
        run: node evals/run_evals.mjs

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build-and-evaluate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
